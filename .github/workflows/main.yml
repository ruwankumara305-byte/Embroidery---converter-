name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Build React App
        run: CI=false npm run build
      
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli
      
      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.emb.stitch",
            "appName": "Embroidery",
            "webDir": "build"
          }
          EOF
      
      - name: Initialize Capacitor
        run: |
          npx cap init "Embroidery" "com.emb.stitch" --web-dir=build
          npx cap add android
          npx cap copy
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Clean Gradle Cache Completely
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf android/.gradle/
          rm -rf android/app/build/
      
      - name: Build APK with Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --info
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embroidery-app
          path: android/app/build/outputs/apk/debug/*.apk
