name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Build React App
        run: CI=false npm run build
      
      - name: Install Capacitor 4
        run: |
          npm install @capacitor/core@4.8.0 @capacitor/android@4.8.0 @capacitor/cli@4.8.0
      
      - name: Create Capacitor Config
        run: |
          echo '{"appId":"com.emb.stitch","appName":"Embroidery","webDir":"build"}' > capacitor.config.json
      
      - name: Initialize Capacitor
        run: |
          npx cap init "Embroidery" "com.emb.stitch" --web-dir=build
          npx cap add android
          npx cap copy
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embroidery-app
          path: android/app/build/outputs/apk/debug/*.apk
